name: Build and Release

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running'
        required: false
        default: 'Manual release'
  push:
    tags:
      - '*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd client
          npm ci
          npm run generate
          cd ..
          npm install -g @yao-pkg/pkg

      - name: Build Dist
        run: |
          npm run build-win
          npm run build-linux
          VERSION="$( eval echo $( jq '.version' package.json) )"
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Package Artifacts
        run: zip release-asset.zip  dist/debian/usr/share/audiobookshelf/audiobookshelf dist/win/audiobookshelf.exe dist/audiobookshelf_${{ env.APP_VERSION }}_amd64.deb

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/debian/usr/share/audiobookshelf/audiobookshelf
            dist/win/audiobookshelf.exe
            dist/audiobookshelf_${{ env.APP_VERSION }}_amd64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
